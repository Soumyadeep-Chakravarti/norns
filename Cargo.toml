[workspace]
resolver = "3"
members = [
  "crates/norns-core",
  "crates/norns-protocol",
  "crates/norns-client",
  "crates/norns-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/YOUR_USERNAME/norns"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
nonstandard_style = { level = "deny", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
